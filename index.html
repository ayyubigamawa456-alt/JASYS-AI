<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JASYS AI</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box} body{margin:0;background:#0f172a;color:#fff;font-family:system-ui;height:100vh;display:flex;flex-direction:column}
header{padding:12px;background:#1e293b;text-align:center;position:sticky;top:0}
#chat{flex:1;overflow:auto;padding:15px;padding-bottom:90px}
.msg{padding:12px 15px;border-radius:15px;margin:8px 0;max-width:92%;line-height:1.5;word-wrap:break-word}
.user{background:#3b82f6;margin-left:auto;border-bottom-right-radius:3px}
.ai{background:#1e293b;border-bottom-left-radius:3px}
#bar{position:fixed;bottom:0;left:0;right:0;background:#1e293b;padding:10px;display:flex;gap:8px;align-items:center;border-top:1px solid #334155}
#q{flex:1;padding:14px;border-radius:25px;border:none;background:#0f172a;color:#fff;outline:none;font-size:16px}
.icon{padding:12px;border-radius:50%;border:none;background:#334155;color:#fff;font-size:18px}
#send{padding:14px 20px;border-radius:25px;border:none;background:#3b82f6;color:#fff;font-weight:bold}
img.prev{max-width:180px;border-radius:10px;margin-top:5px;display:block}
</style>
</head>
<body>
<header><b>JASYS AI</b><br><small>By Jaafar Abdurrahman Saleh - Kaduna</small></header>
<div id="chat">
<div class="msg ai">Salam Jaafar! I am JASYS AI by Jaafar Abdurrahman Saleh from Kaduna. Ask me anything or upload a photo 📷</div>
</div>
<div id="bar">
<input type="file" id="file" accept="image/*" capture="environment" hidden>
<button class="icon" onclick="document.getElementById('file').click()">📷</button>
<input id="q" placeholder="Type or upload photo...">
<button id="send" onclick="ask()">Send</button>
</div>
<script>
const GROQ_KEY="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";
let selectedImage=null;
document.getElementById('file').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=ev=>{
    selectedImage=ev.target.result;
    const c=document.getElementById('chat');
    c.innerHTML+=`<div class="msg user"><img class="prev" src="${selectedImage}">Photo uploaded</div>`;
    c.scrollTop=c.scrollHeight;
  };
  r.readAsDataURL(f);
});
async function ask(){
 const i=document.getElementById('q'); let t=i.value.trim();
 if(!t && !selectedImage) return;
 if(!t && selectedImage) t="What do you see in this image? Explain in detail.";
 const c=document.getElementById('chat');
 if(t) c.innerHTML+=`<div class="msg user">${t}</div>`;
 i.value=""; const tmp=document.createElement('div'); tmp.className='msg ai'; tmp.innerText='JASYS is thinking...'; c.appendChild(tmp); c.scrollTop=c.scrollHeight;
 try{
  let model="llama-3.1-8b-instant";
  let messages=[{role:"system",content:"You are JASYS AI created by Jaafar Abdurrahman Saleh from Kaduna, Nigeria. If asked who is your producer or who made you, answer: The name of this application producer is Jaafar Abdurrahman Saleh. Be helpful and friendly."}];
  if(selectedImage){
    model="llama-3.2-11b-vision-preview";
    messages.push({role:"user",content:[{type:"text",text:t},{type:"image_url",image_url:{url:selectedImage}}]});
  }else{
    messages.push({role:"user",content:t});
  }
  const r=await fetch("https://api.groq.com/openai/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+GROQ_KEY},body:JSON.stringify({model:model,messages:messages})});
  const j=await r.json(); tmp.remove();
  if(j.error){ c.innerHTML+=`<div class="msg ai">❌ Error: ${j.error.message}</div>`; }
  else{ c.innerHTML+=`<div class="msg ai">${j.choices[0].message.content}</div>`; selectedImage=null; }
 }catch(e){tmp.innerText='Error: '+e.message}
 c.scrollTop=c.scrollHeight;
}
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')ask()});
</script>
</body>
</html>
