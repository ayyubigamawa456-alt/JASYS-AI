<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JASYS AI - Photo Version</title>
<style>
body{margin:0;font-family:system-ui;background:#020617;color:#fff;display:flex;flex-direction:column;height:100vh}
#head{background:#0f172a;padding:14px;text-align:center}
#head b{color:#38bdf8}
#setup{background:#1e293b;padding:8px;display:flex;gap:6px}
#setup input{flex:1;padding:10px;border-radius:8px;border:none}
#chat{flex:1;overflow-y:auto;padding:12px}
.m{padding:10px 14px;border-radius:16px;margin:6px 0;max-width:85%;white-space:pre-wrap;overflow-wrap:anywhere}
.user{background:#2563eb;margin-left:auto}
.ai{background:#1e293b;border:1px solid #334155}
.m img{max-width:100%;border-radius:12px;margin-top:8px;display:block}
#box{display:flex;padding:10px;background:#0f172a;gap:6px;align-items:center}
#q{flex:1;min-width:0;padding:12px;border-radius:20px;border:none;background:#1e293b;color:#fff}
button{padding:10px 14px;border-radius:20px;border:none;background:#38bdf8;font-weight:bold;cursor:pointer}
#file{display:none}
@media(max-width:420px){#box{gap:4px;padding:8px}button{padding:10px}#q{padding:10px}}
</style>
</head>
<body>
<div id="head"><b>JASYS AI PHOTO</b><br><small>Producer: Jaafar Abdurrahman Saleh - Photos Allowed</small></div>
<div id="setup"><input id="api" type="password" placeholder="Paste Groq API key"><button onclick="saveKey()">Save</button></div>
<div id="chat"><div class="m ai">Now I can see photos! Tap 📷 to select a photo, type a question, then tap Send.</div></div>
<div id="box">
<label for="file" style="background:#334155;padding:10px 12px;border-radius:20px;cursor:pointer" aria-label="Choose photo">📷</label>
<input id="file" type="file" accept="image/*">
<input id="q" placeholder="Ask about photo..." autocomplete="off">
<button id="send">Send</button>
</div>
<script>
const chat=document.getElementById('chat');
const q=document.getElementById('q');
const api=document.getElementById('api');
const fileInput=document.getElementById('file');
let selectedImageBase64=null;
api.value=localStorage.getItem('groq_key')||'';

function saveKey(){
  const key=api.value.trim();
  if(!key){alert('Please paste your Groq API key first.');return;}
  localStorage.setItem('groq_key',key);
  alert('API key saved in this browser on this device.');
}
function add(t,c,imgSrc){
  const d=document.createElement('div');
  d.className='m '+c;
  d.textContent=t;
  if(imgSrc){
    const im=document.createElement('img');
    im.src=imgSrc;
    im.alt='Selected photo';
    d.appendChild(im);
  }
  chat.appendChild(d);
  chat.scrollTop=chat.scrollHeight;
  return d;
}
fileInput.onchange=e=>{
  const file=e.target.files[0];
  if(!file)return;
  if(!file.type.startsWith('image/')){alert('Please choose an image file.');fileInput.value='';return;}
  if(file.size>10*1024*1024){alert('Please choose an image smaller than 10 MB.');fileInput.value='';return;}
  const reader=new FileReader();
  reader.onload=ev=>{
    selectedImageBase64=ev.target.result;
    add('Photo selected (will be sent with your next message)','user',selectedImageBase64);
  };
  reader.readAsDataURL(file);
};
async function send(){
  const text=q.value.trim();
  const key=localStorage.getItem('groq_key');
  if(!text&&!selectedImageBase64)return;
  if(!key){alert('Paste your Groq API key and tap Save first.');return;}
  const imageToSend=selectedImageBase64;
  const prompt=text||(imageToSend?'What is in this photo?':'');
  if(!prompt)return;
  add(prompt,'user',imageToSend);
  q.value='';
  const bot=add(imageToSend?'Analyzing photo...':'Thinking...','ai');
  document.getElementById('send').disabled=true;
  try{
    const modelName=imageToSend?'meta-llama/llama-4-scout-17b-16e-instruct':'openai/gpt-oss-120b';
    const systemPrompt=`You are JASYS AI.
Identity: You are JASYS AI, an AI application produced by Jaafar Abdurrahman Saleh from Kaduna, Nigeria.
If the user asks who produced, made, created, owns, developed, or built this application, answer exactly: "The name of this application producer is Jaafar Abdurrahman Saleh"
For other questions, answer normally. You can analyze photos when one is provided.`;
    const userContent=imageToSend?[
      {type:'text',text:prompt},
      {type:'image_url',image_url:{url:imageToSend}}
    ]:prompt;
    const res=await fetch('https://api.groq.com/openai/v1/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
      body:JSON.stringify({
        model:modelName,
        messages:[{role:'system',content:systemPrompt},{role:'user',content:userContent}],
        max_completion_tokens:2048
      })
    });
    const data=await res.json();
    if(!res.ok||data.error){
      bot.textContent='Error: '+(data.error?.message||('HTTP '+res.status+'. Check your API key, model access, and internet connection.'));
      return;
    }
    bot.textContent=data.choices?.[0]?.message?.content||'No response received. Please try again.';
  }catch(e){
    bot.textContent='Connection error: '+e.message+'. Check your internet connection and try again.';
  }finally{
    selectedImageBase64=null;
    fileInput.value='';
    document.getElementById('send').disabled=false;
    q.focus();
  }
}
document.getElementById('send').onclick=send;
q.addEventListener('keydown',e=>{if(e.key==='Enter')send();});
</script>
</body>
</html>

<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JASYS AI</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box}body{margin:0;background:#0f172a;color:#fff;font-family:sans-serif;height:100vh;display:flex;flex-direction:column}
header{padding:15px;background:#1e293b;text-align:center}
#chat{flex:1;overflow:auto;padding:15px;padding-bottom:90px}
.msg{padding:12px;border-radius:12px;margin:8px 0;max-width:90%}
.user{background:#3b82f6;margin-left:auto}
.ai{background:#1e293b;white-space:pre-wrap}
#bar{position:fixed;bottom:0;left:0;right:0;background:#1e293b;padding:10px;display:flex;gap:8px}
#q{flex:1;padding:14px;border-radius:25px;border:none;background:#0f172a;color:#fff;outline:none}
button{padding:14px;border-radius:25px;border:none;font-weight:bold}
#cam{background:#334155;color:#fff}
#send{background:#3b82f6;color:#fff}
img.p{max-width:200px;border-radius:10px;display:block;margin-top:5px}
</style>
</head><body>
<header><b>JASYS AI</b><br><small>Jaafar Abdurrahman Saleh - Kaduna</small></header>
<div id="chat"><div class="msg ai">Salam Jafar! I am JASYS AI by Jaafar Abdurrahman Saleh. Ask text or 📷 photo</div></div>
<div id="bar">
<input type="file" id="f" accept="image/*" hidden>
<button id="cam" onclick="f.click()">📷</button>
<input id="q" placeholder="Type here...">
<button id="send" onclick="go()">Send</button>
</div>
<script>
const KEY="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";
let img=null;
const f=document.getElementById('f'); const chat=document.getElementById('chat'); const q=document.getElementById('q');
f.onchange=e=>{
 const file=e.target.files[0]; if(!file)return;
 const rd=new FileReader();
 rd.onload=x=>{ img=x.target.result; chat.innerHTML+=`<div class="msg user"><img class="p" src="${img}"></div>`; chat.scrollTop=chat.scrollHeight; };
 rd.readAsDataURL(file);
};
async function go(){
 let t=q.value.trim(); if(!t && !img)return; if(!t) t="Describe this image in detail";
 chat.innerHTML+=`<div class="msg user">${t}</div>`; q.value="";
 let d=document.createElement('div'); d.className='msg ai'; d.innerText='Thinking...'; chat.appendChild(d); chat.scrollTop=chat.scrollHeight;
 let modelsToTry = img ? ["meta-llama/llama-4-maverick-17b-128e-instruct","llama-3.2-11b-vision-preview","llama-3.2-90b-vision-preview"] : ["openai/gpt-oss-20b"];
 try{
  for(let m of modelsToTry){
   try{
    let msgs=[{role:"system",content:"You are JASYS AI by Jaafar Abdurrahman Saleh, Kaduna. If asked who is producer say: The name of this application producer is Jaafar Abdurrahman Saleh"}];
    if(img){ msgs.push({role:"user",content:[{type:"text",text:t},{type:"image_url",image_url:{url:img}}]}); } else { msgs.push({role:"user",content:t}); }
    let r=await fetch("https://api.groq.com/openai/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+KEY},body:JSON.stringify({model:m,messages:msgs})});
    let j=await r.json();
    if(j.error){ if(j.error.message.includes("does not exist") || j.error.message.includes("model")) continue; else throw new Error(j.error.message); }
    d.remove(); chat.innerHTML+=`<div class="msg ai">${j.choices[0].message.content}</div>`; img=null; chat.scrollTop=chat.scrollHeight; return;
   }catch(e){ continue; }
  }
  d.innerText="Error: No model worked. Try new API key.";
 }catch(err){ d.innerText="Error: "+err.message; }
 chat.scrollTop=chat.scrollHeight;
}
q.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
</script>
</body></html>
