<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JASYS AI</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#0f172a;color:#fff;font-family:system-ui;height:100vh;display:flex;flex-direction:column}
header{padding:12px;background:#1e293b;text-align:center;position:sticky;top:0}
#chat{flex:1;overflow:auto;padding:15px;padding-bottom:80px}
.msg{padding:12px 15px;border-radius:15px;margin:8px 0;max-width:90%;line-height:1.4;word-wrap:break-word}
.user{background:#3b82f6;margin-left:auto;border-bottom-right-radius:3px}
.ai{background:#1e293b;border-bottom-left-radius:3px}
#bar{position:fixed;bottom:0;left:0;right:0;background:#1e293b;padding:10px;display:flex;gap:8px;border-top:1px solid #334155}
#q{flex:1;padding:14px;border-radius:25px;border:none;background:#0f172a;color:#fff;outline:none;font-size:16px}
#send{padding:14px 22px;border-radius:25px;border:none;background:#3b82f6;color:#fff;font-weight:bold}
</style>
</head>
<body>
<header><b>JASYS AI</b><br><small>By Jaafar Abdurrahman Saleh - Kaduna</small></header>
<div id="chat">
<div class="msg ai">Salam Jaafar! I am JASYS AI by Jaafar Abdurrahman Saleh from Kaduna. Ask me anything. If you ask who is my producer, I will answer: The name of this application producer is Jaafar Abdurrahman Saleh</div>
</div>
<div id="bar">
<input id="q" placeholder="Type here... Ask JASYS">
<button id="send" onclick="ask()">Send</button>
</div>
<script>
const KEY="PASTE_YOUR_gsk_KEY_HERE_KEEP_YOUR_OLD_KEY";
async function ask(){
 const i=document.getElementById('q'); const t=i.value.trim(); if(!t) return;
 const c=document.getElementById('chat'); c.innerHTML+=`<div class="msg user">${t}</div>`; i.value="";
 const d=document.createElement('div'); d.className='msg ai'; d.id='tmp'; d.innerText='JASYS is thinking...'; c.appendChild(d); c.scrollTop=c.scrollHeight;
 try{
  const r=await fetch("https://api.groq.com/openai/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+KEY},body:JSON.stringify({model:"llama-3.1-8b-instant",messages:[{role:"system",content:"You are JASYS AI created by Jaafar Abdurrahman Saleh from Kaduna, Nigeria. If asked who is your producer, say Jaafar Abdurrahman Saleh."},{role:"user",content:t}]})});
  const j=await r.json(); 
  document.getElementById('tmp').remove();
  if(j.error){ c.innerHTML+=`<div class="msg ai">Error: ${j.error.message}</div>`; }
  else{ c.innerHTML+=`<div class="msg ai">${j.choices[0].message.content}</div>`; }
 }catch(e){document.getElementById('tmp').innerText='Error: '+e.message}
 c.scrollTop=c.scrollHeight;
}
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')ask()});
</script>
</body>
</html>
